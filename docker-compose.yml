services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: yu-ai-agent-backend:latest
    container_name: yu-ai-agent-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8123
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SPRING_AI_DASHSCOPE_API_KEY: ${SPRING_AI_DASHSCOPE_API_KEY:-}
      AMAP_MCP_API_KEY: ${AMAP_MCP_API_KEY:-}
      SEARCH_API_API_KEY: ${SEARCH_API_API_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - backend-tmp:/app/tmp
    expose:
      - "8123"

  frontend:
    build:
      context: ./yu-ai-agent-frontend
      dockerfile: Dockerfile
    image: yu-ai-agent-frontend:latest
    container_name: yu-ai-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  backend-tmp:
